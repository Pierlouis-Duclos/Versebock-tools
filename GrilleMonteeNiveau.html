<div> <!--fonctions pour Mana-->
  <script>
    boutonMana = document.getElementById("mana");
    boutonNbPoints = document.getElementById("NbPoint");
    boutonPv = document.getElementById("PV");
    divMana = document.getElementById("divMana");

    function augmenterMultiplicateur() {
      manaMultiplier = (manaMultiplier + 2) % 6;
      document.getElementById("buyMana").innerHTML = "+" + manaMultiplier;
      document.getElementById("sellMana").innerHTML = "-" + manaMultiplier;
      return '&times;' + manaMultiplier;
    }

    function acheterMana() {
      augmenterMana(manaMultiplier);
    }

    function vendreMana() {
      if (ptsMana - manaMultiplier >= getPtsManaBase(NiveauActuel)) {
        augmenterMana(-manaMultiplier);
      }
    }

    function visibleMana() {
      let listeMana = document.getElementsByClassName("manaButton");
      for (let index = 0; index < listeMana.length; index++) {
        listeMana[index].style.display = "inline";
      }
      divMana.style.display = "flex";
      setPtsMana(getPtsManaBase(NiveauActuel));
    }

    /**
     * @description Renvoie le nombre de points de mana de base de la classe au niveau actuel de la classe
     * @param {*} niveau : le niveau pour lequel on veut obtenir le nombre de pts de mana de base
     */
    function getPtsManaBase(niveau) {
      return listeMana[niveau - 1];
    }

    function setPtsMana(ptsDeMana) {
      ptsMana = ptsDeMana;
      boutonMana.innerHTML = "Points de mana: " + ptsMana;
    }
    /**
     * Fait varier le nombre de points de mana de l'utilisateur 
     * (augmente la variable "ptsMana" de nombre si "nombre" est 
     * positif, sinon diminue la variable "ptsMana" de "nombre")
     */
    function augmenterMana(nombre) {
      ptsMana += nombre;
      modifierNbPoints(-nombre);
      boutonMana.innerHTML = "Points de mana: " + ptsMana;
    }

    function visibleVertu() {
      boutonMana.innerHTML = "Points de vertu: " + 3 * NiveauActuel;
      boutonMana.style.display = "inline";
    }
  </script>
</div>

  <script> /* fonctions niveaux 1-10 */
    function LvlX(key) {
      switch (key) {
        case "1":
          Lvl(1);

    function Lvl(niveau) {
      if (0 < niveau && niveau < 11 && niveau != NiveauActuel) {
        let i = 10
        while (niveau < i) {
          let colonneNivI = document.getElementsByClassName("niveau" + i)[0].children;
          let j;
          if (aAmbydexterie) {
            j = 2;
          } else {
            j = 1;
          }
          for (; j < colonneNivI.length; j++) {
            colonneNivI[j].style.cursor = "not-allowed";
            colonneNivI[j].disabled = true;
          }
          i--;
        }
        i = 1;
        while (niveau >= i) {
          let colonneNivI = document.getElementsByClassName("niveau" + i)[0].children;
          for (let j = 1; j < colonneNivI.length; j++) {
            colonneNivI[j].style.cursor = "pointer";
            colonneNivI[j].disabled = false;
          }
          i++;
        }
        if (aMana) {
          let ptsManaAjoutes = ptsMana - getPtsManaBase(NiveauActuel);
          setPtsMana(getPtsManaBase(niveau) + ptsManaAjoutes);
        }
        NiveauActuelB = NiveauActuel;
        NiveauActuel = niveau;
        if (aVertu) {
          visibleVertu();
        }
        if (NiveauActuel < NiveauActuelB) {
          NbPointF(ptsDepart, ptsParNiveau, NiveauActuel);
          resetGrille();
        } else {
          NbPointB = NbPoint; //todo: optimiser le code
          NbPointF(ptsDepart, ptsParNiveau, NiveauActuelB);
          NbPointB = NbPoint - NbPointB;
          NbPointF(ptsDepart, ptsParNiveau, NiveauActuel);
          NbPoint -= NbPointB;
        }
        modifierNbPoints(0);
        ajusterBordersLvl(niveau);
      }
    }

  <script>

    function cliquerNiveauComp(name) {
      if (name != '0') {
        {
          let a = name.split(":");
          numComp = Number(a[0]);
          nivComp = Number(a[1]);
        }
        boutonMana.innerHTML = name;
        choisirComp(numComp, nivComp);
      }
    }

    function choisirComp(numeroComp, niveauComp, reset = false) {
      let boutonNiveauActuel = document.getElementsByName(numeroComp + ":" + niveauComp)[0];
      let coutNiveau = listeNiveauxCompetences[numeroComp - 1][niveauComp - 1];
      let nivCompPrise = estPrise(numeroComp, niveauComp);
      let suivPrise;
      let aPreced = niveauComp > 1;
      {
        let aSuiv = aNiveauSuivant(numeroComp, niveauComp);
        suivPrise = (aSuiv ? estPrise(numeroComp, niveauComp + 1) : false);
      }
      if (nivCompPrise && !suivPrise) {
        if (numeroComp >= numeroCompPvSup) {
          modifierNbPv(-1);
        }
        modifierNbPoints(coutNiveau);
        boutonNiveauActuel.innerHTML = coutNiveau;
        if ((event.ctrlKey || reset) && aPreced) {
          choisirComp(numeroComp, niveauComp - 1, reset);
        }
      } else if (!nivCompPrise) {
        let precedPrise = true;

        if (aPreced) {
          precedPrise = estPrise(numeroComp, niveauComp - 1);
        }
        if (!precedPrise) {
          choisirComp(numeroComp, niveauComp - 1);
        }
        if (numeroComp >= numeroCompPvSup) {
          modifierNbPv(1);
        }
        boutonNiveauActuel.innerHTML = "0";
        modifierNbPoints(-coutNiveau);
      }
    }

    function aNiveauPrecedant(niveauComp) {
      return niveauComp > 1;
    }

    function aNiveauSuivant(numeroComp, niveauComp) {
      return niveauComp < listeNiveauxCompetences[numeroComp - 1].length;
    }

    function estPrise(numeroComp, niveauComp) {
      return document.getElementsByName(numeroComp + ":" + niveauComp)[0].innerHTML == "0";
    }

    function resetComp(numeroComp) {
      let nombreDeNiveaux = listeNiveauxCompetences[numeroComp - 1].length;
      let i = 0;
      while (i < nombreDeNiveaux && estPrise(numeroComp, i + 1)) {
        i++;
      }
      if (i > 0) {
        choisirComp(numeroComp, i, true);
      }
    }


    function modifierNbPv(nombre) {
      nombrePv += nombre;
      //modifierNbPoints(-4*nombre);
      boutonPv.innerHTML = "PV: " + nombrePv;
    }

    function modifierNbPoints(ptsAAjouter) {
      NbPoint += ptsAAjouter;
      boutonNbPoints.innerHTML = "Points de compétence: " + NbPoint;
    }

      NbPoint = PointsDeDepart + (PointsParMonteeDeNiveau * (Niveau - 1))

      document.getElementById("NbPoint").style.display = "inline";
