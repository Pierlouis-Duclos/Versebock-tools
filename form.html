    /**
     * Charge les paramètres se trouvant dans l'URL et les met dans le forms
     * Ces éléments sont: classe, niveau, nbPv et ptsMana/ptsVertu/rien 
     */
    function chargerParamsURL() {
        let j = document.getElementById("truite");
        const queryString = window.location.search;
        urlParams = new URLSearchParams(queryString);
        //j.innerHTML = urlParams.getAll("competence")[0];
        debutComp = 6;
        aMana = false;
        aVertu = false;
        if (urlParams.has("ptsMana")) {
            aMana = true;
            debutComp += 1;
        } else if (urlParams.has("ptsVertu")) {
            aVertu = true;
            debutComp += 1;
        }
        /*
        for (let index = debutComp; index < urlParams.size; index++) {
            const element = Array.from(urlParams.keys())[index];
            console.log(urlParams.get(element).split(",")[1]);
        }*/
        let classe = urlParams.get("classe");
        classe = classe.replace("HommeDuPeuple", "Homme du peuple ").replace("Entrepreneur", "entrepreneur")
            .replace("Forgeron", "forgeron").replace("Soigneur", "soigneur").replace("Necromancien", "Nécromancien")
            .replace("Pretre", "Prêtre");
        document.getElementById("classe").value = classe;
        niveau = urlParams.get("niveau");
        document.getElementById("niveau").value = niveau;
        pv = urlParams.get("nbPv");
        document.getElementById("pv").value = pv;
        if (aMana) {
            document.getElementById("ptsMana").value = urlParams.get("ptsMana");
        } else if (aVertu) {
            document.getElementById("labelMana").innerText = "Points de vertu : "
            document.getElementById("ptsMana").value = urlParams.get("ptsVertu");
        } else {
            document.getElementById("labelMana").style.display = "none";
            document.getElementById("ptsMana").style.display = "none";
        }
        changerClasse();
    }
